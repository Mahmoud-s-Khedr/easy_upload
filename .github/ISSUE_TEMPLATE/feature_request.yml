name: Feature request
description: Suggest a new capability or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: api_spec
    attributes:
      label: API or spec impact
      description: Note any expected protocol, schema, or documentation impact
  - type: textarea
    id: ops
    attributes:
      label: Operational impact
      description: Storage, scaling, observability, or migration concerns

