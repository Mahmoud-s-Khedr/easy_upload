name: Bug report
description: Report a defect in the current implementation
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, database, and any relevant deployment details
    validations:
      required: true
  - type: input
    id: storage_backend
    attributes:
      label: Storage backend
      description: local, s3, r2, or other compatible backend
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or request samples

