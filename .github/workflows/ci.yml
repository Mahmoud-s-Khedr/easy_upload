name: CI

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify documentation files
        run: |
          test -f README.md
          test -f LICENSE
          test -f docs/README.md
          test -f docs/technical_spec_v1.md
          test -f docs/client_integration_guide.md

