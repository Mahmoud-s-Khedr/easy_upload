services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: easy
      POSTGRES_PASSWORD: easy
      POSTGRES_DB: easy_upload_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easy -d easy_upload_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio-test:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: testkey
      MINIO_ROOT_PASSWORD: testsecret
    ports:
      - "9002:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio-test-init:
    image: minio/mc:latest
    depends_on:
      minio-test:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio-test:9000 testkey testsecret &&
        mc mb --ignore-existing local/test-bucket
      "
