services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: easy
      POSTGRES_PASSWORD: easy
      POSTGRES_DB: easy_upload
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easy -d easy_upload"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/easy-upload
      "

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/db/migrations:/migrations:ro
    environment:
      PGPASSWORD: easy
    command: >
      psql -h postgres -U easy -d easy_upload -f /migrations/001_init.sql
    restart: "no"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file: .env.dev
    ports:
      - "8080:8080"
    volumes:
      - serverdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  client:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./client:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"

volumes:
  pgdata:
  miniodata:
  serverdata:
